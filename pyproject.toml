[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genshen-desktop-skin"
version = "1.0.7"
description = "原神桌面皮肤集合（29 套）：壁纸 / VSCode·Trae·CodeX 扩展 / PyCharm 背景 / DSH 插件 / Windows 桌宠 一键安装"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "WPH666-py" }]
keywords = [
  "genshin", "genshin-impact", "原神", "wallpaper", "壁纸", "skin", "皮肤",
  "vscode", "trae", "codex", "pycharm", "desktop-pet", "桌宠", "deepseek-harness",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Environment :: MacOS X",
  "Topic :: Desktop Environment :: Screen Savers",
  "Topic :: Multimedia :: Graphics",
  "Natural Language :: Chinese (Simplified)",
]

[project.urls]
Homepage = "https://github.com/WPH666-py/Genshen-Desktop-Skin"
Source = "https://github.com/WPH666-py/Genshen-Desktop-Skin"
Repository = "https://github.com/WPH666-py/Genshen-Desktop-Skin"
"皮肤仓库集合" = "https://github.com/WPH666-py/Genshen-Desktop-Skin#-%E7%9A%AE%E8%82%A4%E7%9B%AE%E5%BD%95"

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=4.0"]

[project.scripts]
genshen-skin = "genshen_skins.cli:main"
gss = "genshen_skins.cli:main"

[tool.setuptools]
packages = ["genshen_skins"]
# 顶层兼容入口：让 `python -m genshen-skin` 与 `python -m genshen_skin` 也能用。
# `python -m` 是按字符串在 sys.path 里找模块，不要求名字是合法标识符，
# 所以带连字符的 genshen-skin.py 可行（`import genshen-skin` 才不行）。
py-modules = ["genshen-skin", "genshen_skin"]
include-package-data = true

[tool.setuptools.package-data]
genshen_skins = ["catalog.json", "assets/*.ps1", "assets/*.bat"]
